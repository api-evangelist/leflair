aid: leflair
name: Leflair
description: 'Leflair is a Vietnamese online retail brand selling discounted authentic
  international brands across fashion and accessories, beauty and health, home and
  lifestyle, and children''s products. Its own terms of service describe it as Vietnam''s
  first members-only flash-sale platform, running daily promotional events on branded
  goods. The live storefront at leflair.com is operated by Cong ty TNHH Sopa Technology
  of Ho Chi Minh City on the Haravan commerce platform, and is supported by a Vietnamese-language
  editorial blog, an account/sign-in surface, and published terms, privacy, payment-security,
  shipping, and tax policy pages. Leflair is a consumer retail brand: as of this enrichment
  pass it publishes no developer portal, public API, SDK, or machine-readable API
  definition, and its historical leflair.vn domain no longer serves the storefront.
  Surfaced in the API Evangelist network as a 500 Global portfolio company.'
